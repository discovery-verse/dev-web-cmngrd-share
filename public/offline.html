<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Common Ground</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        color: #2b2420;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 22rem; }
      h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
      p { color: #6f6359; line-height: 1.55; margin: 0 0 1.5rem; font-size: 0.95rem; }
      button {
        background: #a8512e;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 0.8rem 1.6rem;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Common Ground needs a connection for fresh content. Anything you've already opened is still available once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
